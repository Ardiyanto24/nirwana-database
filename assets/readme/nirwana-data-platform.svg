<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title description">
  <title id="title">Nirwana Data Platform</title>
  <desc id="description">Alur data dari operasi hotel menuju warehouse, serving layer, dan observability.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#102b3b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="480" fill="url(#background)"/>
  <g opacity="0.13" stroke="#93c5fd" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280"/>
    <path d="M80 0V480M160 0V480M240 0V480M320 0V480M400 0V480M480 0V480M560 0V480M640 0V480M720 0V480M800 0V480M880 0V480M960 0V480M1040 0V480M1120 0V480M1200 0V480"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="116" fill="#f8fafc" font-size="52" font-weight="700" letter-spacing="1">NIRWANA DATA PLATFORM</text>
    <text x="84" y="156" fill="#a7f3d0" font-size="21" letter-spacing="1.3">GOVERNED ANALYTICS · AI-READY SERVING · OBSERVABLE OPERATIONS</text>
    <text x="84" y="202" fill="#cbd5e1" font-size="18">An end-to-end data platform for a multi-property hospitality operation.</text>
  </g>
  <g fill="none" stroke="url(#line)" stroke-linecap="round" stroke-width="4" filter="url(#glow)">
    <path d="M154 328H336"/>
    <path d="M474 328H656"/>
    <path d="M794 328H976"/>
  </g>
  <g fill="#2dd4bf">
    <circle cx="154" cy="328" r="8"/><circle cx="336" cy="328" r="8"/>
    <circle cx="474" cy="328" r="8"/><circle cx="656" cy="328" r="8"/>
    <circle cx="794" cy="328" r="8"/><circle cx="976" cy="328" r="8"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(84 284)">
      <rect width="182" height="88" rx="12" fill="#12263a" stroke="#2dd4bf"/>
      <text x="20" y="35" fill="#f8fafc" font-size="16" font-weight="700">OPERATIONS</text>
      <text x="20" y="61" fill="#94a3b8" font-size="14">Production data</text>
    </g>
    <g transform="translate(404 284)">
      <rect width="182" height="88" rx="12" fill="#12263a" stroke="#60a5fa"/>
      <text x="20" y="35" fill="#f8fafc" font-size="16" font-weight="700">WAREHOUSE</text>
      <text x="20" y="61" fill="#94a3b8" font-size="14">dbt · BigQuery</text>
    </g>
    <g transform="translate(724 284)">
      <rect width="182" height="88" rx="12" fill="#12263a" stroke="#a78bfa"/>
      <text x="20" y="35" fill="#f8fafc" font-size="16" font-weight="700">SERVING</text>
      <text x="20" y="61" fill="#94a3b8" font-size="14">PostgreSQL · RBAC</text>
    </g>
    <g transform="translate(1044 284)">
      <rect width="152" height="88" rx="12" fill="#12263a" stroke="#fbbf24"/>
      <text x="20" y="35" fill="#f8fafc" font-size="16" font-weight="700">OBSERVE</text>
      <text x="20" y="61" fill="#94a3b8" font-size="14">Signals · alerts</text>
    </g>
  </g>
  <text x="84" y="432" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="14">SYSTEM OVERVIEW  /  DOCUMENTATION ENTRY POINT</text>
</svg>
